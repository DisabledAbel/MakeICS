name: Clear Repo URL

on:
  push:
  workflow_dispatch:

jobs:
  clear-url:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Website URL
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          for i in {1..30}; do
            HOMEPAGE=$(gh repo view ${{ github.repository }} --json homepage --jq .homepage 2>/dev/null)
            if [ -n "$HOMEPAGE" ] && [ "$HOMEPAGE" != "null" ]; then
              gh repo edit ${{ github.repository }} --homepage "" > /dev/null
              echo "Iteration $i: URL was removed."
            else
              echo "Iteration $i: No URL was removed."
            fi
            sleep 10
          done
