name: Fetch NBA Schedules

on:
  push:
    branches: [main]
    paths:
      - scripts/fetch-nba.js
      - .github/workflows/fetch-nba.yml
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch NBA schedules
        run: node scripts/fetch-nba.js

      - name: Validate and stage fetched data
        run: node scripts/validate-fetch-output.js nba --stage
      - name: Commit and push schedules
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "DisabledAbel"
          git config --global user.email "196466003+DisabledAbel@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No NBA schedule changes to commit."
            exit 0
          fi

          git commit -m "📅 Update NBA schedules"
          git pull --rebase origin "$REF_NAME"
          git push origin HEAD:"$REF_NAME"
