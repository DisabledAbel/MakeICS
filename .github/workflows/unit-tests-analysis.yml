name: Daily Unit Tests & Bug Scanning Analysis

on:
  schedule:
    - cron: '0 12 * * *' # Daily at 4:00 AM PST (12:00 PM UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  analyze-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Scan and OpenRouter Analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/analyze-code.js

      - name: Create GitHub Issue with Findings
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "analysis-report.md" ]; then
            echo "Creating issue..."
            gh issue create \
              --title "🔍 Codebase Analysis Report: $(date +'%Y-%m-%d') 🔍" \
              --body-file analysis-report.md \
              --label "bug" \
              --label "documentation"
          else
            echo "No analysis report file found to generate an issue."
          fi
