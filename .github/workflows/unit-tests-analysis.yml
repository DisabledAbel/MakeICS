name: Daily Unit Tests & Bug Scanning Analysis

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC: 4 AM PST / 5 AM PDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install playwright==1.64.0

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Scan and OpenRouter Analysis
        id: analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/analyze-code.js

      - name: Upload analysis artifacts
        if: ${{ always() && steps.analysis.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analysis-report.md
            analysis-logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update GitHub Issue with Findings
        if: ${{ !cancelled() && steps.analysis.outcome == 'failure' && hashFiles('analysis-report.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="🔍 Codebase Analysis Report: ${GITHUB_REF_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '\n\n---\nRun: %s\nCommit: %s\n' "$run_url" "$GITHUB_SHA" >> analysis-report.md
          # Use the API rather than search indexing, so recently created issues are visible.
          issue_number=$(gh api --paginate "repos/${GH_REPO}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '.[] | select(.pull_request == null) | {number, title}' | \
            jq -s --arg title "$title" 'map(select(.title == $title))[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file analysis-report.md
          else
            gh issue create --title "$title" --body-file analysis-report.md
          fi
