name: Fetch WNBA Schedules

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: data-updates-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Fetch WNBA Schedules
        id: fetch-wnba
        run: node scripts/fetch-wnba.js
        continue-on-error: true

      - name: Commit and Push WNBA
        if: steps.fetch-wnba.outcome == 'success'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "DisabledAbel"
          git config --global user.email "196466003+DisabledAbel@users.noreply.github.com"

          git add lib/data/sports/supplemental/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "📅 Update WNBA schedules"
          git pull --rebase origin "$REF_NAME"
          git push origin HEAD:"$REF_NAME"

      - name: Fetch Portland Fire Schedule
        id: fetch-portland-fire
        run: node scripts/fetch-portland-fire.js
        continue-on-error: true

      - name: Commit and Push Portland Fire
        if: steps.fetch-portland-fire.outcome == 'success'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "DisabledAbel"
          git config --global user.email "196466003+DisabledAbel@users.noreply.github.com"

          git add lib/data/sports/supplemental/152565.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "📅 Update Portland Fire schedule"
          git pull --rebase origin "$REF_NAME"
          git push origin HEAD:"$REF_NAME"

      - name: Check for failures
        if: steps.fetch-wnba.outcome != 'success' || steps.fetch-portland-fire.outcome != 'success'
        run: |
          echo "One or more fetch steps failed."
          exit 1
