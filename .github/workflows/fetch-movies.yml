name: Fetch Movie Release Calendar

on:
  schedule:
    - cron: '0 5 * * *' # Daily at 5:00 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-movies:
    runs-on: ubuntu-latest
    concurrency:
      group: data-updates-${{ github.workflow }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Fetch Movies
        run: node scripts/fetch-movies.js

      - name: Commit and push changes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "DisabledAbel"
          git config --global user.email "196466003+DisabledAbel@users.noreply.github.com"

          git add lib/data/movies/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🎞 Update movie release calendar 🎞"
          git pull --rebase origin "$REF_NAME"
          git push origin HEAD:"$REF_NAME"
