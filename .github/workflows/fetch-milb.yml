name: Fetch MiLB Schedule

on:
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch:

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39225597fd64c2319224039129528585b8954421 # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Fetch MiLB Schedules
        run: node scripts/fetch-milb.js

      - name: Commit and Push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "DisabledAbel"
          git config --global user.email "196466003+DisabledAbel@users.noreply.github.com"

          git add lib/data/sports/supplemental/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "📅 Update MiLB schedules"
          git pull --rebase origin "$REF_NAME"
          git push origin HEAD:"$REF_NAME"
